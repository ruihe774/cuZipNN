[project]
name = "cuzipnn"
version = "0.1.0"
requires-python = ">=3.13,<4"
dependencies = [
    "torch~=2.14.0",
    "nvidia-libnvcomp-cu13~=5.3",
    "cuda-pathfinder~=1.6",
]

[build-system]
requires = ["uv_build~=0.12"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 96
target-version = "py313"
